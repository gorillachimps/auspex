name: weekly-ledger

# Appends one attribution row to LEDGER.md every Monday — the longevity record
# for the builder-program review. Reads only the public CLOB builder/trades
# endpoint (stdlib urllib; no deps, no secrets).

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Deliberately NOT in the shared `auspex-main-writer` group. GitHub keeps only
  # ONE pending run per group, so a newer queued run cancels the older one — with
  # the high-frequency data workflows in the same group, a delayed ledger run can
  # be starved and silently skip a week (observed: a data-refresh run cancelled
  # this way on 2026-08-06). Data misses self-heal on the next tick; a missed
  # ledger row is a permanent hole in the longevity record. Own group + the
  # rebase-and-retry push below make racing safe without sharing the queue.
  group: auspex-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Append this week's row
        run: |
          ROW="$(python3 builder_stats.py | grep -E '^\| 20' | head -1)"
          if [ -z "$ROW" ]; then
            echo "No ledger row produced — endpoint down or format changed."
            exit 1
          fi
          WEEK="$(echo "$ROW" | awk -F'|' '{print $2}' | tr -d ' ')"
          if grep -q "| $WEEK |" LEDGER.md; then
            echo "Row for $WEEK already recorded — exiting clean."
            exit 0
          fi
          echo "$ROW" >> LEDGER.md
          echo "Appended: $ROW"

      - name: Commit if changed
        run: |
          git config user.name "auspex-bot"
          # Repo owner's noreply so Vercel accepts the auto-deploy this commit
          # triggers (same convention as the data workflows).
          git config user.email "96061296+gorillachimps@users.noreply.github.com"
          git add LEDGER.md
          if git diff --cached --quiet; then
            echo "No changes — exiting clean."
            exit 0
          fi
          git commit -m "ledger: weekly attribution row ($(date -u +%Y-%m-%d))"
          # Now that this workflow has its own concurrency group, a data
          # workflow can push between our checkout and our push. Rebase and
          # retry instead of failing (and losing the week's row). The rebase is
          # trivially safe: our commit only appends one line to LEDGER.md, which
          # no other workflow writes.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "Could not push the ledger row after 5 attempts."
          exit 1
