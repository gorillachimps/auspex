name: data-refresh

# Re-runs the price-enrichment step (~1s) to refresh snapshot odds/volumes.
#
# Cadence history: 15 min → 2 h (2026-07-26, Fluid-CPU cap) → 4 h (2026-08-06,
# Pro credit burn). Every data
# commit triggers a Vercel deploy, and each deploy resets the ISR cache for
# ~2,500 crawl-promoted pages — at ~23 deploys/day, crawler re-renders were
# the dominant CPU burn. Live PRICES don't depend on this workflow (they come
# from Binance per-request via lib/livePrices + client polling); this refresh
# only ages implied odds/volumes, which the UI labels with an honest
# snapshot-age chip.
#
# To rebuild the full dataset (pick up new markets), see data-rebuild.yml.

on:
  schedule:
    - cron: "37 */4 * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  # Shared across all three main-writing workflows (refresh / rebuild /
  # leaderboard-stats) so they serialize instead of racing on `git push` — two
  # concurrent runs from the same base commit produce a non-fast-forward that
  # silently drops one side's changes until the next run (up to 6h).
  group: auspex-main-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pipeline deps
        run: |
          python -m pip install --upgrade pip
          # Only what enrich_state.py needs — no SDK, no signing.
          pip install requests python-dotenv

      - name: Run enrich_state.py
        run: python enrich_state.py

      - name: Commit if changed
        run: |
          git config user.name "auspex-bot"
          # Use the repo owner's GitHub-attributable noreply so Vercel accepts
          # the auto-deploy triggered by this commit. A bare `auspex-bot@…` email
          # doesn't map to any GitHub account, and Vercel blocks unverifiable
          # authors by default on the Hobby plan.
          git config user.email "96061296+gorillachimps@users.noreply.github.com"
          if git diff --quiet data/enriched-markets.json; then
            echo "No changes — exiting clean."
            exit 0
          fi
          # Include the freshness sidecar so the displayed snapshot age tracks
          # each refresh. Staged only here (after the data-change early-exit
          # above), so it never triggers a commit/deploy on its own.
          git add data/enriched-markets.json data/snapshot-meta.json
          git commit -m "data: refresh enriched snapshot ($(date -u +%H:%MZ))"
          git push
